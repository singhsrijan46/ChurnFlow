apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: churnflow-api-ingress
  namespace: churnflow
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: churnflow-api-service
                port:
                  number: 80
