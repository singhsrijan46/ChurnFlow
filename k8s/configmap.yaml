apiVersion: v1
kind: ConfigMap
metadata:
  name: churnflow-api-config
  namespace: churnflow
data:
  APP_NAME: "ChurnFlow"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  MLFLOW_TRACKING_URI: "http://churnflow-mlflow:5000"
  MODEL_NAME: "churn_prediction_model"
  MODEL_VERSION: "1.0.0"
  DRIFT_THRESHOLD: "0.20"
  MIN_AUC: "0.80"
  MIN_F1: "0.55"
