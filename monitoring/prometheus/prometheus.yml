global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "churnflow-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000", "localhost:8000"]
        labels:
          application: "churnflow"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
